[package]
name = "shadowsock-local"
version = "0.1.4"
authors = ["simacuo <noemail@anybox.com>"]
edition = "2024"

[lib]
name = "shadowsocks"

[[bin]]
name = "ss-local"
path = "src/bin/ss-local.rs"

[dependencies]
log = "0.4"
log4rs = { version = "~1.2.0", default-features = false, features = [
    "config_parsing",
    "yaml_format",
    "console_appender",
    "rolling_file_appender",
    "compound_policy",
    "size_trigger",
    "fixed_window_roller",
    "pattern_encoder",
    "background_rotation",
] }
serde = "~1.0.0"
serde_json = "~1.0.0"
serde_derive = "~1.0.0"
bytes = "~1.2.1"
libsodium-sys = "~0.2.7"
byteorder = "~1.3.0"
byte_string = "~1.0.0"
clap = "~2.32.0"
aws-lc-rs = { version = "~1.19.0", optional = true, default-features = false, features = [
    "alloc",
    "aws-lc-sys",
] }
ring = { version = "~0.16.20", optional = true }
tokio = { version = "~1.54.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "macros",
] }

[target.'cfg(windows)'.dependencies]
pcre2 = "0.1.1"
fnv = "1.0.6"
parking_lot = "0.7.1"
ipnet = "2.0.0"

[features]
default = ["cipher-aws-lc"]
cipher-aws-lc = ["aws-lc-rs"]
cipher-ring = ["ring"]

[profile.release]
debug = false
lto = "fat"
incremental = false
codegen-units = 1
strip = "symbols"
panic = "abort"
